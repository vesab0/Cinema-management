services:
  backend:
    build:
      context: ./cinema-backend
    tty: true
    ports:
      - "5000:5000"
    volumes:
      - ./cinema-backend:/app
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      - Jwt__Key=${JWT__KEY}
      - DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION=true
      - PredictorUrl=${PREDICTOR_URL}
      - SendGrid__ApiKey=${SendGrid__ApiKey}
      - SendGrid__FromEmail=${SendGrid__FromEmail}
      - SendGrid__FromName=${SendGrid__FromName}
      - Stripe__PublishableKey=${Stripe__PublishableKey}
      - Stripe__SecretKey=${Stripe__SecretKey}
      - Stripe__WebhookSecret=${Stripe__WebhookSecret}
      - Filebase__BucketName=${Filebase__BucketName}
      - Filebase__PublicUrl=${Filebase__PublicUrl}
      - Filebase__AccessKeyId=${Filebase__AccessKeyId}
      - Filebase__SecretAccessKey=${Filebase__SecretAccessKey}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - marquee-network

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marquee-network

volumes:
  mysql_data:

networks:
  marquee-network:
    driver: bridge